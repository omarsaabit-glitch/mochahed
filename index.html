<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mochahed</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f141e;color:#fff;font-family:system-ui;padding:15px}
.header{text-align:center;padding:20px 0}
.header h1{font-size:28px}
.card{background:#1a2233;border-radius:18px;overflow:hidden;margin-bottom:16px;position:relative;border:1px solid #222}
.card video,.card img{width:100%;height:220px;object-fit:cover;display:block}
.play{position:absolute;top:50%;left:50%;transform:translate(-50%,-70%);width:70px;height:70px;background:rgba(255,255,255,.25);backdrop-filter:blur(5px);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:30px}
.info{padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.info p{font-size:14px;line-height:1.4;flex:1;text-align:right}
.btn{background:#eef2f7;color:#111;padding:8px 16px;border-radius:12px;font-weight:700;font-size:13px;text-decoration:none;display:flex;align-items:center;gap:6px;white-space:nowrap}
.footer{text-align:center;margin-top:30px}
.create{background:#2a3449;padding:12px 20px;border-radius:25px;display:inline-flex;align-items:center;gap:10px;color:#fff;text-decoration:none;font-weight:600}
.links{margin-top:25px;color:#6b7a99;font-size:13px}
</style>
</head>
<body>

<div class="header"><h1>Mochahed 🎬</h1><p style="color:#8a9bb5;margin-top:5px">صانع محتوى من مكناس</p></div>

<div class="card">
  <div style="position:relative">
    <video src="IMG_4401.mov" poster="" muted></video>
    <div class="play">▶️</div>
  </div>
  <div class="info">
    <p>فيديو جديد - Mochahed<br>مكناس 🇲🇦</p>
    <a class="btn" href="IMG_4401.mov" target="_blank">▶️ شاهد الآن</a>
  </div>
</div>

<div class="card">
  <div style="position:relative">
    <video src="IMG_4401.mov" muted></video>
    <div class="play">▶️</div>
  </div>
  <div class="info">
    <p>فلوق جديد قريبا<br>تابعوني 🔥</p>
    <a class="btn" href="IMG_4401.mov" target="_blank">▶️ شاهد الآن</a>
  </div>
</div>

<div class="card">
  <div style="position:relative">
    <video src="IMG_4401.mov" muted></video>
    <div class="play">▶️</div>
  </div>
  <div class="info">
    <p>محتوى جديد كل يوم<br>Mochahed</p>
    <a class="btn" href="IMG_4401.mov" target="_blank">▶️ شاهد الآن</a>
  </div>
</div>

<div class="footer">
  <a class="create" href="#">◎ Create your link</a>
  <div class="links">About · Report · Terms · Privacy</div>
</div>

<script>
document.querySelectorAll('.card').forEach(c=>{
  c.addEventListener('click',()=>{
    let v=c.querySelector('video');
    if(v.paused) v.play(); else v.pause();
  })
})
</script>
</body>
</html>
