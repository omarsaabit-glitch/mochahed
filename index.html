<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شاهد الفار كايتحوا</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:Arial;text-align:center}
h1{color:#ff0055}
.video-box{max-width:800px;margin:20px auto;background:#1a1a1a;padding:10px;border-radius:10px}
video{width:100%;border-radius:10px;background:#000}
a.btn{display:inline-block;background:#ff0055;color:#fff;padding:10px 20px;border-radius:20px;text-decoration:none;margin-top:20px}
</style>
</head>
<body>
<h1>🔥 شاهد الفار كايتحوا 🔥</h1>
<div id="videos"></div>
<script>
const videos=[
"IMG_4662.mov"
];
const container=document.getElementById('videos');
videos.forEach(url=>{
const ext=url.split('.').pop().toLowerCase();
const type=ext==='mov'?'video/quicktime':'video/mp4';
container.innerHTML+=`
<div class="video-box">
<video controls playsinline><source src="${url}" type="${type}"></video>
</div>`;
});
</script>
<p><a class="btn" href="/admin.html">🔒 لوحة التحكم</a></p>
</body>
</html>
