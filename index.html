<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>موحى شاهد 🔥</title>
<style>
body{background:#0a0a0a;color:#fff;font-family:system-ui;text-align:center;padding:20px}
h1{color:#ff0055}
.video-box{max-width:800px;margin:20px auto;background:#1a1a1a;padding:15px;border-radius:15px}
video{width:100%;border-radius:10px;background:#000}
a.btn{display:inline-block;background:#ff0055;color:#fff;padding:12px 25px;border-radius:25px;text-decoration:none;margin:10px}
</style>
</head>
<body>
<h1>🔥 موحى شاهد 🔥</h1>
<div id="videos"></div>
<script>
const videos=[
"https://files.catbox.moe/5be7je.mp4"
];
const container=document.getElementById('videos');
videos.forEach(url=>{
const ext=url.split('.').pop().toLowerCase();
const type=ext==='mov'?'video/quicktime':'video/mp4';
container.innerHTML+=`
<div class="video-box">
<video controls playsinline><source src="${url}" type="${type}">المتصفح ديالك ما كيدعمش الفيديو</video>
<p>${url.split('/').pop()}</p>
</div>`;
});
</script>
<p><a class="btn" href="/admin.html">🔒 لوحة التحكم</a></p>
</body>
</html>
