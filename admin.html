<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>لوحة التحكم</title>
<style>body{background:#111;color:#fff;font-family:system-ui;padding:20px;max-width:600px;margin:auto}input{width:100%;padding:12px;margin:8px 0;border-radius:8px;border:none}button{width:100%;padding:12px;background:#ff0055;color:#fff;border:none;border-radius:8px;font-size:16px;cursor:pointer}</style>
</head>
<body>
<h2>🔒 لوحة التحكم</h2>
<div id="login"><input type="password" id="pass" placeholder="الباسورد"><button onclick="check()">دخول</button></div>
<div id="panel" style="display:none">
<h3>زيد فيديو (mp4 أو mov)</h3>
<input id="url" placeholder="رابط Catbox مثلا https://files.catbox.moe/xxx.mov">
<input id="title" placeholder="عنوان الفيديو">
<button onclick="add()">+ اضافة</button>
<div id="list"></div>
<button onclick="save()" style="background:#00cc66;margin-top:20px">💾 حفظ وتحميل index.html</button>
</div>
<script>
let vids=["https://files.catbox.moe/5be7je.mp4"];
function check(){if(document.getElementById('pass').value==='Hakima@123-'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';render()}else alert('باسورد غالط')}
function render(){document.getElementById('list').innerHTML=vids.map((u,i)=>`<p>${u} <button onclick="vids.splice(${i},1);render()" style="width:auto;background:#333;padding:5px 10px">مسح</button></p>`).join('')}
function add(){const u=document.getElementById('url').value.trim();if(!u)return alert('دخل الرابط');if(!u.includes('.mp4')&&!u.includes('.mov'))if(!confirm('الرابط ما فيهش.mp4 ولا.mov واش متأكد؟'))return;vids.push(u);document.getElementById('url').value='';render()}
function save(){let html=`<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>موحى شاهد 🔥</title><style>body{background:#0a0a0a;color:#fff;font-family:system-ui;text-align:center;padding:20px}h1{color:#ff0055}.video-box{max-width:800px;margin:20px auto;background:#1a1a1a;padding:15px;border-radius:15px}video{width:100%;border-radius:10px;background:#000}a.btn{display:inline-block;background:#ff0055;color:#fff;padding:12px 25px;border-radius:25px;text-decoration:none;margin:10px}</style></head><body><h1>🔥 موحى شاهد 🔥</h1><div id="videos"></div><script>const videos=${JSON.stringify(vids)};const container=document.getElementById('videos');videos.forEach(url=>{const ext=url.split('.').pop().toLowerCase();const type=ext==='mov'?'video/quicktime':'video/mp4';container.innerHTML+=\`<div class=\\"video-box\\"><video controls playsinline><source src="\${url}" type="\${type}">المتصفح ما كيدعمش</video><p>\${url.split('/').pop()}</p></div>\`;});<\/script><p><a class="btn" href="/admin.html">🔒 لوحة التحكم</a></p></body></html>`;let blob=new Blob([html],{type:'text/html'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='index.html';a.click()}
</script>
</body>
</html>
